services:
  dev:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    volumes:
      - ..:/workspace:cached
      - /workspace/node_modules
    env_file:
      - path: ../.envs/aws.env
        required: false  # solo se necesita desde el Lab 2
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/paytrack
    depends_on:
      - postgres
    command: sleep infinity

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paytrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@paytrack.co
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # Lab 2 (streaming): broker de Kafka de un nodo en modo KRaft (sin ZooKeeper).
  #   - desde tu computador:            localhost:9092
  #   - desde los contenedores de Spark: kafka:29092 (red paytrack-streaming)
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3  # los topics se crean solos con 3 particiones
    networks:
      - default
      - streaming

networks:
  streaming:
    name: paytrack-streaming

volumes:
  postgres_data:
