[project]
name = "paytrack-bigdata-labs"
version = "0.1.0"
description = "SI7006 Big Data Labs 2026-2 — PayTrack Colombia"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "faker>=24.0",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "rich>=13.0",
    "confluent-kafka>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.3",
    "mypy>=1.9",
    "ipykernel",
]

[tool.uv]
package = false  # repositorio de labs, no un paquete instalable

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["labs"]
