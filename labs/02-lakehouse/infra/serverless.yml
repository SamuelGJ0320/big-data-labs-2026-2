# ================================================================
# Lab 2 · Infraestructura del lakehouse de PayTrack
#   S3 (raw + lakehouse Delta) · 4 jobs de Glue 5.0 · catálogo · Athena
#   Streaming: Kinesis Data Streams · 1 job de Glue Streaming (Spark Structured Streaming)
#
# Despliegue:  serverless deploy --stage dev
# Limpieza:    ver README (vaciar el bucket y luego serverless remove)
# ================================================================
service: paytrack-lakehouse
frameworkVersion: "3"

provider:
  name: aws
  region: ${env:AWS_DEFAULT_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}

custom:
  bucketName: paytrack-lakehouse-${env:STUDENT_ID}-${aws:accountId}
  glueJobArgs:
    "--BASE": s3://${self:custom.bucketName}
    "--INGEST_DATE": "none"
    "--datalake-formats": delta
    "--conf": "spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog"
    "--extra-py-files": s3://${self:custom.bucketName}/scripts/common.py
    "--enable-continuous-cloudwatch-log": "true"
  streamName: paytrack-transactions
  # El job de streaming recibe los mismos argumentos más los del stream
  streamJobArgs:
    "--BASE": s3://${self:custom.bucketName}
    "--SOURCE": kinesis
    "--STREAM": arn:aws:kinesis:${aws:region}:${aws:accountId}:stream/${self:custom.streamName}
    "--BOOTSTRAP": "none"
    "--RUN_SECONDS": "300"
    "--datalake-formats": delta
    "--conf": "spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog"
    "--extra-py-files": s3://${self:custom.bucketName}/scripts/common.py
    "--enable-continuous-cloudwatch-log": "true"

resources:
  Resources:
    # ── S3 ───────────────────────────────────────────────────
    LakehouseBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.bucketName}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        LifecycleConfiguration:
          Rules:
            - Id: expire-athena-results
              Status: Enabled
              Prefix: athena-results/
              ExpirationInDays: 7
            # Ciclo de vida SOLO de la zona raw/ (los lotes tal como llegaron).
            # Justificación: raw es la fuente de verdad para auditoría y reprocesamiento,
            # así que NO expira (sin ExpirationInDays). Pero un lote se re-procesa en
            # días, no en meses: pasado ese tiempo el acceso es poco frecuente, así que
            # se abarata el almacenamiento sin perder el dato. Transiciones:
            #   - 30 días  -> STANDARD_IA  (acceso infrecuente, aún recuperable al instante)
            #   - 90 días  -> GLACIER_IR   (archivado con recuperación inmediata; más barato)
            # Se aplica EXCLUSIVAMENTE al prefijo raw/: lakehouse/, checkpoints/ y
            # athena-results/ no se ven afectados.
            #
            # Nota (informe): sobre lakehouse/ (tablas Delta) NO se pone expiración
            # porque Delta reescribe/compacta archivos y el _delta_log referencia
            # versiones antiguas; expirar objetos por edad rompería el time travel y
            # podría dejar la tabla inconsistente. En su lugar se usa la gestión propia
            # de Delta (OPTIMIZE y VACUUM con un periodo de retención controlado).
            - Id: raw-tiering
              Status: Enabled
              Prefix: raw/
              Transitions:
                - TransitionInDays: 30
                  StorageClass: STANDARD_IA
                - TransitionInDays: 90
                  StorageClass: GLACIER_IR

    # ── Glue: catálogo y permisos ────────────────────────────
    GlueDatabase:
      Type: AWS::Glue::Database
      Properties:
        CatalogId: !Ref AWS::AccountId
        DatabaseInput:
          Name: paytrack_lakehouse
          Description: Tablas Delta del lakehouse de PayTrack

    GlueRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: glue.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        Policies:
          - PolicyName: lakehouse-access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                  Resource:
                    - arn:aws:s3:::${self:custom.bucketName}
                    - arn:aws:s3:::${self:custom.bucketName}/*
                - Effect: Allow
                  Action:
                    - kinesis:DescribeStream
                    - kinesis:DescribeStreamSummary
                    - kinesis:GetRecords
                    - kinesis:GetShardIterator
                    - kinesis:ListShards
                  Resource: !GetAtt TransactionStream.Arn

    # ── Glue: un job por capa ────────────────────────────────
    BronzeJob:
      Type: AWS::Glue::Job
      Properties:
        Name: paytrack-bronze
        Role: !GetAtt GlueRole.Arn
        GlueVersion: "5.0"
        WorkerType: G.1X
        NumberOfWorkers: 2
        Timeout: 15
        Command:
          Name: glueetl
          PythonVersion: "3"
          ScriptLocation: s3://${self:custom.bucketName}/scripts/bronze.py
        DefaultArguments: ${self:custom.glueJobArgs}

    SilverJob:
      Type: AWS::Glue::Job
      Properties:
        Name: paytrack-silver
        Role: !GetAtt GlueRole.Arn
        GlueVersion: "5.0"
        WorkerType: G.1X
        NumberOfWorkers: 2
        Timeout: 15
        Command:
          Name: glueetl
          PythonVersion: "3"
          ScriptLocation: s3://${self:custom.bucketName}/scripts/silver.py
        DefaultArguments: ${self:custom.glueJobArgs}

    GoldJob:
      Type: AWS::Glue::Job
      Properties:
        Name: paytrack-gold
        Role: !GetAtt GlueRole.Arn
        GlueVersion: "5.0"
        WorkerType: G.1X
        NumberOfWorkers: 2
        Timeout: 15
        Command:
          Name: glueetl
          PythonVersion: "3"
          ScriptLocation: s3://${self:custom.bucketName}/scripts/gold.py
        DefaultArguments: ${self:custom.glueJobArgs}

    AuditJob:
      Type: AWS::Glue::Job
      Properties:
        Name: paytrack-audit
        Role: !GetAtt GlueRole.Arn
        GlueVersion: "5.0"
        WorkerType: G.1X
        NumberOfWorkers: 2
        Timeout: 15
        Command:
          Name: glueetl
          PythonVersion: "3"
          ScriptLocation: s3://${self:custom.bucketName}/scripts/audit.py
        DefaultArguments: ${self:custom.glueJobArgs}

    # ── Streaming ────────────────────────────────────────────
    # Kinesis cobra por shard-hora aunque no le llegue nada: elimínalo al terminar.
    TransactionStream:
      Type: AWS::Kinesis::Stream
      Properties:
        Name: ${self:custom.streamName}
        ShardCount: 2
        RetentionPeriodHours: 24
        StreamModeDetails:
          StreamMode: PROVISIONED

    StreamJob:
      Type: AWS::Glue::Job
      Properties:
        Name: paytrack-stream
        Role: !GetAtt GlueRole.Arn
        GlueVersion: "5.0"
        WorkerType: G.1X
        NumberOfWorkers: 2
        Timeout: 20  # minutos: tope de seguridad por si el job no se detiene solo
        Command:
          Name: gluestreaming
          PythonVersion: "3"
          ScriptLocation: s3://${self:custom.bucketName}/scripts/stream.py
        DefaultArguments: ${self:custom.streamJobArgs}

    # ── Athena ───────────────────────────────────────────────
    AthenaWorkGroup:
      Type: AWS::Athena::WorkGroup
      Properties:
        Name: paytrack-lakehouse-wg
        RecursiveDeleteOption: true
        WorkGroupConfiguration:
          EnforceWorkGroupConfiguration: true
          PublishCloudWatchMetricsEnabled: true
          EngineVersion:
            SelectedEngineVersion: Athena engine version 3
          ResultConfiguration:
            OutputLocation: s3://${self:custom.bucketName}/athena-results/

  Outputs:
    LakehouseBucket:
      Value: !Ref LakehouseBucket
    TransactionStream:
      Value: !Ref TransactionStream
